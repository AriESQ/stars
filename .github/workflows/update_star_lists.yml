name: Update Star Lists

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-star-lists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-star-lists:
    name: Update star lists
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit updated github_stars.json
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync

    - name: Fetch latest changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        git pull --rebase origin master

    - name: Run star lists update script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USERNAME: ${{ github.repository_owner }}
      run: |
        echo "GITHUB_USERNAME: $GITHUB_USERNAME"
        echo "GITHUB_TOKEN is set: $([ -n "$GITHUB_TOKEN" ] && echo true || echo false)"
        set -o pipefail
        uv run python scripts/update_star_lists.py 2>&1 | tee /tmp/update-star-lists.log

    - name: Write failure summary
      if: failure()
      run: |
        {
          echo "## ❌ Star lists update failed"
          echo ""
          echo '```'
          tail -30 /tmp/update-star-lists.log 2>/dev/null || echo "(no output captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Commit and push if changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git add github_stars.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update star lists data" && git push)
