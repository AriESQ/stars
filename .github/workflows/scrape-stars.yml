name: Scrape GitHub Stars

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape-stars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run tests
      run: |
        set -o pipefail
        uv run pytest tests/test_scrape.py 2>&1 | tee /tmp/pytest.log

    - name: Write failure summary
      if: failure()
      run: |
        {
          echo "## ❌ Tests failed"
          echo ""
          echo '```'
          tail -30 /tmp/pytest.log 2>/dev/null || echo "(no output captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  scrape-stars:
    name: Scrape starred repositories
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit updated github_stars.json
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync

    - name: Run star scraper
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USERNAME: ${{ github.repository_owner }}
      run: |
        set -o pipefail
        uv run python scripts/scrape_stars.py 2>&1 | tee /tmp/scrape-stars.log

    - name: Write failure summary
      if: failure()
      run: |
        {
          echo "## ❌ Star scraper failed"
          echo ""
          echo '```'
          tail -30 /tmp/scrape-stars.log 2>/dev/null || echo "(no output captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Commit and push if changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        git add github_stars.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update GitHub stars data" && git push)
