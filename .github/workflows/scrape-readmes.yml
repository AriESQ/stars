name: Scrape READMEs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape-readmes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-readmes:
    name: Scrape starred-repo READMEs
    runs-on: ubuntu-24.04
    permissions:
      contents: write # commit updated github_stars.json and readmes/
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync

    - name: Fetch latest changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        git pull --rebase origin master

    - name: Run README scraper
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USERNAME: ${{ github.repository_owner }}
      run: |
        set -o pipefail
        uv run python scripts/scrape_readmes.py 2>&1 | tee /tmp/scrape-readmes.log

    - name: Write failure summary
      if: failure()
      run: |
        {
          echo "## ❌ README scraper failed"
          echo ""
          echo '```'
          tail -30 /tmp/scrape-readmes.log 2>/dev/null || echo "(no output captured)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Commit and push if changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git add github_stars.json readmes
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update README corpus" && git push)
